name: Deploy phone app

# Publishes phone/ to GitHub Pages whenever it changes on main. Turn Pages
# on once first: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches:
      - main
    paths:
      - "phone/**"
      - "resonance/recipes.py"
      - "supabase/functions/_shared/reminders.js"
      - ".github/workflows/phone.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The phone's recipe code must agree with the desktop's.
      - run: node phone/tests/parity.mjs
      - run: node phone/tests/reminders.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phone
      - id: deployment
        uses: actions/deploy-pages@v4
