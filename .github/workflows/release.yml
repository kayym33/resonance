name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install spotipy customtkinter pillow pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --clean --onefile --windowed --name Resonance `
            --icon=assets\icon.ico `
            --add-data "assets\pink_theme.json;assets" `
            --add-data "assets\icon.ico;assets" `
            --add-data "assets\quotes.json;assets" `
            main.py

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Resonance.exe
          generate_release_notes: true
